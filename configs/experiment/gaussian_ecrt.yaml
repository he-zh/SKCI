# @package _global_
# Place this file in: configs/experiment/ecrt.yaml
# e-CRT baseline for conditional independence testing

defaults:
  - /data: gaussiancit
  - /train_shared/baseline_common: gaussian

wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_${train.name}_d${data.d}_${train.model_a_type}_bs${data.samples}"
  task: "gaussian"
  tags: ["mlp"]

data:
  data_seed: ${train.seed}
  samples: 20  # Match your gaussian.yaml default
  d: 19        # Match your gaussian.yaml default
  type: "type2"

train:
  name: "ecrt"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  # e-CRT specific parameters
  K: 5                  # Number of tilde_a samples per test point
  model_x_mode: "oracle"  # 'online', 'pretrained', or 'oracle'

  ecrt_model_hidden_dims: [128, 64]
  ecrt_model_lr: 0.01  
  ecrt_model_weight_decay: 1e-5  
