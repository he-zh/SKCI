# @package _global_
# Place this file in: configs/experiment/ecrt.yaml
# ec2st baseline for conditional independence testing

defaults:
  - /data: gaussiancit
  - /train_shared/baseline_common: gaussian

wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_d${data.d}_${train.name}_${train.model_a_type}_bs${data.samples}"
  task: "gaussian"
  tags: ["mlp"]
data:
  data_seed: ${train.seed}
  samples: 20  # Match your gaussian.yaml default
  d: 19        # Match your gaussian.yaml default
  type: "type2"

train:
  name: "ec2st"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  model_x_mode: "oracle"  # 'online', 'pretrained', or 'oracle'

  ec2st_model_hidden_dims: [128]
  ec2st_model_lr: 0.0005  
  ec2st_model_weight_decay: 0.0  
  ec2st_model_dropout: 0.3
