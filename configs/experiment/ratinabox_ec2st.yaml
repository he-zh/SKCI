# @package _global_
# Place this file in: configs/experiment/ecrt.yaml
# e-CRT baseline for conditional independence testing

defaults:
  - /data: ratinabox
  - /train_shared/baseline_common: ratinabox

wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_d${data.dim}_${train.name}_${train.model_a_type}_bs${data.samples}"
  task: "ratinabox"
  tags: ["mlp"]

data:
  data_seed: ${train.seed}
  samples: 20  
  type: "type2"

train:
  name: "ec2st"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  model_x_mode: "online"  # 'online', 'pretrained', or 'oracle'

  ec2st_model_hidden_dims: [128]
  ec2st_model_lr: 0.0005  
  ec2st_model_weight_decay: 1e-5  
