# @package _global_
# Place this file in: configs/experiment/ecrt.yaml
# e-CRT baseline for conditional independence testing

defaults:
  - /data: sin_d3_012
  - /train_shared/baseline_common: ci_hardness_d3_012

wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_d${data.d}_coord${data.ca_dim_idx}${data.cb_dim_idx}${data.cr_dim_idx}_${train.name}_${train.model_a_type}_bs${data.samples}"
  task: "sin"
  tags: ["mlp"]

data:
  data_seed: ${train.seed}
  samples: 20  
  type: "type2"

train:
  name: "davt"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  model_x_mode: "oracle"  # 'online', 'pretrained', or 'oracle'

  davt_model_hidden_dims: [128]
  davt_model_lr: 0.005  
  davt_model_weight_decay: 0.0  
