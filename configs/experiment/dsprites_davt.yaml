# @package _global_
# DAVT baseline for conditional independence testing on dSprites image data
# Handles mixed inputs: a (1D scalar), b (28x28 image), c (64x64 image)

defaults:
  - /data: dsprites
  - /train_shared/baseline_common: dsprites


wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_b-${data.b_type}_${train.name}_bs${data.samples}_T${train.T}"
  task: "dsprites"
  tags: ["cnn",]


data:
  data_seed: ${train.seed}
  samples: 20
  type: "type1"
  b_type: "image"  # Use full images


train:
  name: "davt"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  # DAVT mode parameters
  model_x_mode: "oracle"  # 'online', 'pretrained', or 'oracle'

  # DAVT model parameters
  davt_model_type: "cnn"  # 'mmdemlp' for vector data, 'cnn' for image data
  davt_model_lr: 0.001
  davt_model_weight_decay: 1e-4
  davt_model_dropout: 0.

  # MMDECNN specific parameters (for image data with mixed inputs)
  # b is 28x28 image, c is 64x64 image
  davt_b_channels: 1  # Channels for image b (grayscale)
  davt_c_channels: 1  # Channels for image c (grayscale)
  davt_b_hidden_channels: [32, 64, 128]  # CNN channels for b encoder (28x28)
  davt_c_hidden_channels: [32, 64, 128, 256]  # CNN channels for c encoder (64x64)
  davt_b_latent_dim: 64  # Latent dim for b encoder output
  davt_c_latent_dim: 64  # Latent dim for c encoder output
  davt_model_fc_hidden_dims: [128]  # Final FC layers after image encoders
