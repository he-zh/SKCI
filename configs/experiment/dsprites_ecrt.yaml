# @package _global_
# e-CRT baseline for conditional independence testing


defaults:
  - /data: dsprites
  - /train_shared/baseline_common: dsprites


wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_b-${data.b_type}_${train.name}_bs${data.samples}_T${train.T}"
  task: "dsprites"
  tags: ["cnn",]


data:
  data_seed: ${train.seed}
  samples: 20
  type: "type1"
  b_type: "image"  # Use full images (autoencoder will encode them)


train:
  name: "ecrt"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  # e-CRT specific parameters
  K: 5                  # Number of tilde_a samples per test point
  model_x_mode: "online"  # 'online', 'pretrained', or 'oracle'

  c_channels: 1  # channels for image input c
  b_channels: 1  # channels for image output b
  ecrt_model_type: "image_regressor"  # 'mlp' for low-dim output, 'image_regressor' for high-dim image output
  ecrt_model_encoder_hidden_channels: [32, 64] 
  ecrt_model_encoder_fc_hidden_size: [32]
  ecrt_model_latent_dim: 32
  ecrt_model_decoder_hidden_channels: [64, 32]
  ecrt_model_lr: 0.01  
  ecrt_model_weight_decay: 1e-4  
