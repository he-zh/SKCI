# @package _global_
# ec2st baseline for conditional independence testing on dSprites image data
# Handles mixed inputs: a (1D scalar), b (28x28 image), c (64x64 image)

defaults:
  - /data: dsprites


wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_b-${data.b_type}_${train.name}_bs${data.samples}_T${train.T}"
  task: "dsprites"
  tags: ["cnn",]


data:
  data_seed: ${train.seed}
  samples: 20
  type: "type1"
  b_type: "image"  # Use full images


train:
  name: "ec2st"
  seed: 0
  seqs: 100
  T: 0
  alpha: 0.05

  # ec2st mode parameters
  model_x_mode: "oracle"  # 'online', 'pretrained', or 'oracle'
  noise_std: 1.0          # Std for Gaussian noise when sampling tilde_a
  pretrain_samples: 3000  # Number of samples for pretraining (if not online)

  # Model architecture
  dropout: 0.1
  layer_norm: true

  # Model A hyperparameters (for estimating P(A|C))
  model_a_type: "mean_estimator"  # "mean_estimator" or "gmmn"
  model_a_feature_extractor_type: "cnn"  # 'mlp' or 'cnn' (only for mean_estimator)
  model_a_input_channels: 1  # Channels for input c (grayscale)
  model_a_hidden_channels: [32, 64, 128]  # CNN channels for c encoder
  model_a_hidden_fc_dims: [32]
  model_a_output_size: 1
  model_a_lr: 0.01
  model_a_weight_decay: 1e-4
  model_a_layer_norm: false
  model_a_dropout: 0.3

  # ec2st model parameters
  ec2st_model_type: "cnn"  # 'mmdemlp' for vector data, 'cnn' for image data
  ec2st_model_fc_hidden_size: [64, 32]  # Final FC layers after image encoders
  ec2st_model_lr: 0.001
  ec2st_model_weight_decay: 1e-4
  ec2st_dropout: 0.

  # MMDECNN specific parameters (for image data with mixed inputs)
  # b is 28x28 image, c is 64x64 image
  ec2st_b_channels: 1  # Channels for image b (grayscale)
  ec2st_c_channels: 1  # Channels for image c (grayscale)
  ec2st_b_hidden_channels: [32, 64, 128]  # CNN channels for b encoder (28x28)
  ec2st_c_hidden_channels: [32, 64, 128, 256]  # CNN channels for c encoder (64x64)
  ec2st_b_latent_dim: 64  # Latent dim for b encoder output
  ec2st_c_latent_dim: 64  # Latent dim for c encoder output

  # Training parameters
  epochs: 500
  batch_size: ${data.samples}
  earlystopping:
    patience: 30
    delta: 0.0
