# @package _global_
defaults:
  - /data: sincorrelation
  - /kernel@model_a: rbf
  - /kernel@model_b: rbf
  - /kernel@model_c: rbf
  - /kernel@model_ca: rbf
  - /kernel@model_cb: rbf



wandb:
  disabled: false
  group: "${train.model_x_mode}_${wandb.task}_d${data.d}_coord${data.ca_dim_idx}${data.cb_dim_idx}${data.cr_dim_idx}_rbf_bs${data.samples}_T${train.T}_betting${train.betting_fraction_trainable}_kc${model_c.is_trainable}"
  task: "sin"
  tags: []

model_a:
  input_dim: 1
  is_trainable: false
  gamma_init_method: null

model_b:
  input_dim: 1
  is_trainable: false
  gamma_init_method: null

model_c:
  input_dim: ${data.d}
  is_trainable: true
  
model_ca:
  input_dim: ${data.d}
  is_trainable: true

model_cb:
  input_dim: ${data.d}
  is_trainable: true


data:
  data_seed: ${train.seed}
  samples: 20
  beta: 3.0
  alpha: 0.1
  d: 1
  type: "type1"
  ca_dim_idx: 0
  cb_dim_idx: 0
  cr_dim_idx: 0

train:
  name: "skci"
  seed: 1
  lr: 0.01
  earlystopping:
    patience: 30
    delta: 0.0
  pretrain_samples: 3000
  # model_x_mode: 'online' (learn on streaming data), 'pretrained' (pretrain with noisy samples), 'oracle' (pretrain with conditional means)
  model_x_mode: "online"
  epochs: 400
  seqs: 50 # number of batches in the sequence
  T: 0 #Warm start number of batches used for the training only
  alpha: 0.05 # significance level
  eps: 1e-6
  betting_fraction_trainable: true
  betting_fraction: 0.0
  batch_size: ${data.samples}
  l1_lambda: 0.0
  l2_lambda: 0.0
